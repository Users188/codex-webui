<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#151517" />
    <title>Codex WebUI</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <div class="brand-row">
          <div class="brand-lockup">
            <span class="brand-mark" aria-hidden="true">C</span>
            <div>
              <div class="brand">Codex</div>
              <div class="connection-row">
                <span class="connection-dot" aria-hidden="true"></span>
                <span class="connection" id="connection" data-i18n="connection.connecting">连接中</span>
              </div>
            </div>
          </div>
          <div class="brand-actions">
            <select class="theme-select" id="themeSelect" aria-label="主题" data-i18n-aria-label="theme.label">
              <option value="system" data-i18n="theme.system">跟随系统</option>
              <option value="light" data-i18n="theme.light">日间</option>
              <option value="dark" data-i18n="theme.dark">夜间</option>
            </select>
            <button class="icon-button mobile-only" id="closeSidebar" aria-label="关闭会话列表" data-i18n-aria-label="sidebar.close">×</button>
          </div>
        </div>

        <button class="primary-action new-thread-action" id="newThread">
          <span aria-hidden="true">＋</span>
          <span data-i18n="thread.new">新会话</span>
        </button>

        <div class="sidebar-search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m20.2 18.8-4.3-4.3a7 7 0 1 0-1.4 1.4l4.3 4.3 1.4-1.4ZM5 10.5a5.5 5.5 0 1 1 11 0 5.5 5.5 0 0 1-11 0Z" /></svg>
          <input id="searchThreads" aria-label="搜索" data-i18n-aria-label="thread.search" placeholder="搜索会话" data-i18n-placeholder="thread.searchPlaceholder" />
        </div>

        <div class="thread-list" id="threadList"></div>

        <section class="usage-card" id="usageCard" aria-labelledby="usageTitle">
          <div class="usage-card-header">
            <div>
              <strong id="usageTitle" data-i18n="usage.title">用量</strong>
              <span id="usagePlan"></span>
            </div>
            <button class="usage-refresh" id="usageRefresh" type="button" data-i18n-title="usage.refresh" aria-label="刷新用量" data-i18n-aria-label="usage.refresh">↻</button>
          </div>
          <div class="usage-windows" id="usageWindows">
            <div class="usage-empty" data-i18n="usage.loading">正在读取用量…</div>
          </div>
        </section>
      </aside>

      <main class="chat-pane">
        <header class="topbar">
          <button class="icon-button mobile-only" id="openSidebar" aria-label="打开会话列表" data-i18n-aria-label="sidebar.open">☰</button>
          <div class="thread-title-wrap">
            <div class="thread-title-line">
              <input class="thread-title" id="threadTitle" placeholder="未选择会话" data-i18n-placeholder="thread.notSelected" disabled />
              <button class="resume-status" id="resumeStatus" type="button" title="点击连接会话" data-i18n="thread.connect" data-i18n-title="thread.connectTitle">点击连接</button>
              <button class="icon-button fullscreen-toggle" id="fullscreenToggle" type="button" aria-label="切换全屏" title="切换全屏" data-i18n-aria-label="fullscreen.toggle" data-i18n-title="fullscreen.toggle">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path class="fullscreen-icon-enter" d="M8 3H3v5h2V5h3V3Zm8 0v2h3v3h2V3h-5ZM5 16H3v5h5v-2H5v-3Zm14 3h-3v2h5v-5h-2v3Z" />
                  <path class="fullscreen-icon-exit" d="M5 16h3v3h2v-5H5v2Zm3-8H5v2h5V5H8v3Zm6 11h2v-3h3v-2h-5v5Zm2-11V5h-2v5h5V8h-3Z" />
                </svg>
              </button>
            </div>
            <div class="thread-meta" id="threadMeta" data-i18n="common.ready">准备就绪</div>
          </div>
        </header>

        <section class="connection-banner hidden" id="connectionBanner" aria-live="polite"></section>

        <section class="auth-panel hidden" id="authPanel">
          <div>
            <strong data-i18n="auth.required">需要登录 Codex</strong>
            <p id="authText" data-i18n="auth.description">可以使用设备码完成登录。</p>
          </div>
          <button class="secondary-action" id="deviceLogin" data-i18n="auth.deviceLogin">设备码登录</button>
        </section>

        <section class="approval-panel hidden" id="approvalPanel"></section>
        <section class="messages" id="messages">
          <div class="empty-state">
            <h1 data-i18n="empty.chooseTitle">选择或创建一个会话</h1>
            <p data-i18n="empty.chooseDescription">手机和电脑在同一 Wi-Fi 下即可使用这个页面继续 Codex 对话。</p>
          </div>
        </section>

        <form class="composer" id="composer">
          <div class="follow-up-menu hidden" id="followUpMenu" role="menu" aria-label="选择后续消息方式" data-i18n-aria-label="composer.chooseFollowUpTitle">
            <button class="follow-up-option" type="button" role="menuitem" data-follow-up-mode="steer">
              <strong data-i18n="composer.steerOption">立即引导</strong>
              <span data-i18n="composer.steerOptionDescription">插入并调整当前回复</span>
            </button>
            <button class="follow-up-option" type="button" role="menuitem" data-follow-up-mode="queue">
              <strong data-i18n="composer.queueOption">加入列队</strong>
              <span data-i18n="composer.queueOptionDescription">当前回复结束后按顺序执行</span>
            </button>
            <button class="follow-up-option danger" type="button" role="menuitem" data-follow-up-mode="stop">
              <strong data-i18n="composer.stopOption">停止当前回复</strong>
              <span data-i18n="composer.stopOptionDescription">保留已有内容并中断正在执行的任务</span>
            </button>
          </div>
          <textarea id="promptInput" rows="1" placeholder="发消息给 Codex" data-i18n-placeholder="composer.placeholder"></textarea>
          <button class="send-button" id="sendButton" type="submit" data-i18n="composer.send" aria-label="发送" disabled>发送</button>
        </form>

        <section class="setup-band" id="setupBand">
          <div class="setup-grid">
            <label class="cwd-setting">
              <span data-i18n="settings.cwd">工作目录</span>
              <input id="cwdInput" class="field" readonly />
            </label>
            <label class="context-setting">
              <span id="contextSettingLabel">当前会话</span>
              <div class="setting-summary" id="currentConversationSummary"></div>
              <div class="field-action-row hidden" id="workspaceSettingControls">
                <select id="projectSelect" class="field"></select>
                <button id="browseWorkspace" class="secondary-action compact-action" type="button" data-i18n="workspace.choose">选择工作区</button>
              </div>
            </label>
            <label>
              <span data-i18n="settings.model">模型</span>
              <select id="modelSelect" class="field"></select>
            </label>
            <label>
              <span data-i18n="settings.reasoning">推理强度</span>
              <select id="reasoningSelect" class="field">
                <option value="low" data-i18n="reasoning.low">轻度</option>
                <option value="medium" data-i18n="reasoning.medium">中</option>
                <option value="high" data-i18n="reasoning.high">高</option>
                <option value="xhigh" data-i18n="reasoning.xhigh">极高</option>
              </select>
            </label>
            <label>
              <span data-i18n="settings.permissionMode">权限模式</span>
              <select id="permissionSelect" class="field"></select>
            </label>
          </div>
        </section>
      </main>
    </div>

    <div class="workspace-picker hidden" id="workspacePicker" role="dialog" aria-modal="true" aria-labelledby="workspacePickerTitle">
      <button class="workspace-picker-backdrop" id="workspacePickerBackdrop" type="button" aria-label="关闭工作区选择" data-i18n-aria-label="workspace.close"></button>
      <section class="workspace-picker-panel">
        <header class="workspace-picker-header">
          <div>
            <strong id="workspacePickerTitle" data-i18n="workspace.title">选择电脑工作区</strong>
            <div class="workspace-current-path" id="workspaceCurrentPath"></div>
          </div>
          <button class="icon-button" id="workspacePickerClose" type="button" aria-label="关闭" data-i18n-aria-label="workspace.close">×</button>
        </header>
        <div class="workspace-picker-actions">
          <div class="workspace-navigation-actions">
            <button class="secondary-action" id="workspaceRoots" type="button" data-i18n="workspace.locations">位置</button>
            <button class="secondary-action" id="workspaceParent" type="button" data-i18n="workspace.parent">上一级</button>
          </div>
          <button class="primary-action" id="workspaceUseCurrent" type="button" data-i18n="workspace.useCurrent">使用此文件夹</button>
        </div>
        <div class="workspace-directory-list" id="workspaceDirectoryList"></div>
        <form class="workspace-create" id="workspaceCreateForm">
          <input class="field" id="workspaceName" maxlength="128" placeholder="新工作区名称" data-i18n-placeholder="workspace.namePlaceholder" />
          <button class="secondary-action" type="submit" data-i18n="workspace.create">新建并使用</button>
        </form>
        <div class="workspace-error hidden" id="workspaceError" role="alert"></div>
      </section>
    </div>

    <div class="image-viewer hidden" id="imageViewer" role="dialog" aria-modal="true">
      <button class="image-viewer-backdrop" id="imageViewerBackdrop" type="button" aria-label="Close image preview" data-i18n-aria-label="viewer.close"></button>
      <img id="imageViewerImg" alt="" />
      <button class="image-viewer-close" id="imageViewerClose" type="button" aria-label="Close image preview" data-i18n-aria-label="viewer.close">x</button>
    </div>

    <div class="toast-region" id="toastRegion" aria-live="polite" aria-atomic="true"></div>

    <script src="/vendor/markdown-it.min.js"></script>
    <script src="/vendor/purify.min.js"></script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
